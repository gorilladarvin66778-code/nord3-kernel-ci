name: build-8821au

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 330
    env:
      WORK: ${{ github.workspace }}/nord3-build
      CONFIG_SRC: ${{ github.workspace }}/nord3_running_kernel.config
      LV: "-android12-9"
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost
          df -h /

      - name: Make script executable
        run: chmod +x build_nord3_8821au.sh

      - name: deps
        run: ./build_nord3_8821au.sh deps

      - name: toolchain
        run: ./build_nord3_8821au.sh toolchain

      - name: source
        run: ./build_nord3_8821au.sh source

      - name: debug vendor (runs even if source failed)
        if: always()
        run: |
          echo "--- vendor dir:"; ls -la "$WORK/vendor/oplus" || true
          echo "--- HEAD:"; git -C "$WORK/vendor/oplus" log -1 --oneline || true
          echo "--- tracked sched/Kconfig:"; git -C "$WORK/vendor/oplus" ls-files | grep "sched/Kconfig" || echo "  none"
          echo "--- on disk:"; ls -la "$WORK/vendor/oplus/kernel/cpu/sched/" 2>&1 | head -20 || true
          echo "--- kernel links:"; ls -la "$WORK/kernel/kernel/" 2>&1 | head -20 || true

      - name: config
        run: ./build_nord3_8821au.sh config

      - name: kernel
        run: ./build_nord3_8821au.sh kernel

      - name: driver
        run: ./build_nord3_8821au.sh driver

      - name: check
        run: ./build_nord3_8821au.sh check

      - name: Upload module and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 8821au-build
          path: |
            nord3-build/dist/
            nord3-build/*.log
            nord3-build/missing-syms.txt
          if-no-files-found: warn
