name: build-8821au

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 330
    env:
      WORK: ${{ github.workspace }}/nord3-build
      CONFIG_SRC: ${{ github.workspace }}/nord3_running_kernel.config
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost
          df -h /

      - name: Make script executable
        run: chmod +x build_nord3_8821au.sh

      - name: deps
        run: ./build_nord3_8821au.sh deps

      - name: toolchain
        run: ./build_nord3_8821au.sh toolchain

      - name: source
        run: ./build_nord3_8821au.sh source

      - name: config
        run: ./build_nord3_8821au.sh config

      - name: kernel
        run: ./build_nord3_8821au.sh kernel

      - name: diagnose kernel failure
        if: failure()
        run: |
            kmake -j"$(nproc)" Image modules > "${WORK}/kernel-build.log" 2>&1 || {
              echo "--- real errors:"
              grep -nE "fatal error|error:|undefined reference|Killed|No space" "${WORK}/kernel-build.log" | head -40 || echo "  none matched"
              tail -40 "${WORK}/kernel-build.log"
              fail "kernel build"
            }

      - name: driver
        run: ./build_nord3_8821au.sh driver

      - name: check
        run: ./build_nord3_8821au.sh check

      - name: Upload module and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 8821au-build
          path: |
            nord3-build/dist/
            nord3-build/*.log
            nord3-build/missing-syms.txt
          if-no-files-found: warn
